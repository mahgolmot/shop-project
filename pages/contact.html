<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>

    <link rel="stylesheet" href="../styles/navbar.css" />
    <link rel="stylesheet" href="../styles/contact.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css"
    />
  </head>
  <body>
    <!-- Header and Navbar -->
    <header class="header" id="header">
      <nav class="nav container">
        <a href="home.html" class="nav-logo">Logo</a>
        <div class="nav-menu" id="nav-menu">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="home.html" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="about.html" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="contact.html" class="nav-link">Contact us</a>
            </li>
          </ul>
          <!-- close btn -->
          <div class="nav-close" id="nav-close">
            <a href="#" class="nav-logo-open">Logo</a>
            <i class="ri-close-line"></i>
          </div>
        </div>
        <div class="nav-action">
          <!-- search btn -->
          <i class="ri-search-line"></i>
          <div class="icon-card">
            <i class="ri-shopping-bag-line"></i>
            <span>0</span>
          </div>
          <div class="nav-toggle" id="nav-toggle">
            <i class="ri-menu-line"></i>
          </div>
        </div>
      </nav>
    </header>
    <!-- contact section -->
    <section class="contact">
      <div class="container">
        <div class="contactInfo">
          <div class="box">
            <div class="icon"><i class="ri-map-pin-line"></i></div>
            <div class="text">
              <h3>Address</h3>
              <p>476 Rasht Road <br />Rasht Tehran,<br />25670</p>
            </div>
          </div>
          <div class="box">
            <div class="icon"><i class="ri-customer-service-2-fill"></i></div>
            <div class="text">
              <h3>Phone</h3>
              <p>2133-13434-671</p>
            </div>
          </div>
          <div class="box">
            <div class="icon"><i class="ri-mail-fill"></i></div>
            <div class="text">
              <h3>Email</h3>
              <p>tehran@gmail.com</p>
            </div>
          </div>
        </div>

        <div class="contactForm">
          <form>
            <h2>Message</h2>
            <div class="inputBox">
              <input type="text" id="name" required />
              <span>Full Name</span>
            </div>
            <div class="inputBox">
              <input type="email" id="email" required />
              <span>Email</span>
            </div>
            <div class="inputBox">
              <textarea id="message" rows="5" required></textarea>
              <span>Write your message...</span>
            </div>
            <div>
              <input type="submit" value="Send" />
            </div>
          </form>
        </div>
      </div>
    </section>
    <script src="../js/home.js"></script>
  </body>
</html>
